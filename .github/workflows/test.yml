name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets release.yml gate a publish on this exact same test+lint+security
  # suite via `uses: ./.github/workflows/test.yml`, rather than just
  # trusting that main's last push happened to pass it.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Test-only: fakeredis lets test_distributed_lock.py and
          # test_job_queue.py exercise the Phase 3 distributed lock
          # and RQ job queue without a real Redis server. Deliberately
          # NOT in requirements.txt (that file is what the Docker
          # runtime image installs from — see Dockerfile — and
          # fakeredis has no reason to ship in production).
          pip install "fakeredis[lua]"
          # Test-only, same reasoning: moto mocks S3 for
          # test_remote_backup.py without a real bucket.
          pip install moto
          # Optional extras exercised by dedicated tests (advanced
          # rotators' connection tests degrade gracefully without
          # these, but installing them lets the real success/failure
          # paths run too, not just the "driver missing" fallback).
          pip install rq redis pyshamir

      - name: Run tests with coverage
        run: |
          # Run from repo root, not tests/: coverage.py only auto-discovers
          # pyproject.toml's [tool.coverage.*] config (the web_interface.py
          # omit, the exclude_also patterns) relative to the current
          # directory, and pytest's own addopts (--cov-fail-under=64) is
          # what actually gates the build — the old `cd tests &&
          # python run_tests.py` invocation used a plain unittest runner
          # that never touched coverage or enforced any floor at all.
          pytest tests/

      - name: Upload coverage HTML (Python 3.12 run only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

  lint:
    # Formatting/style/type gates, split from the test matrix so a lint
    # failure is reported distinctly from a real test failure and doesn't
    # need to run four times (once per Python version).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project + lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: black --check (formatting)
        run: black --check src/ tests/

      - name: flake8 (style / obvious bugs)
        run: flake8 src/secret_rotator tests

      - name: mypy (static typing)
        run: mypy src/secret_rotator --exclude 'web_interface.py'

  security-scan:
    # This app runs with access to database credentials and a
    # master encryption key — a compromised/vulnerable dependency here
    # is a direct path to credential theft. Previously nothing caught
    # known-CVE pins or an unofficial/dependency-confusion-shaped
    # package name (mysql_connector_repackaged) automatically; this
    # job exists so both regress loudly in CI instead of silently.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pip-audit bandit

      - name: pip-audit (known-CVE scan of installed dependencies)
        run: pip-audit

      - name: bandit (static security scan of source)
        run: bandit -r src/secret_rotator -ll
