# Secret Rotation Configuration (Example Template)
#
# DOCKER DEPLOYMENT NOTES:
# - This file should be mounted read-only in production: ./config:/app/config:ro
# - Runtime data (keys, secrets, backups) stored in writable /app/data volume
# - Copy this file to config.yaml and customize for your environment
#
# DO NOT commit config.yaml with secrets to version control!

rotation:
  schedule: "daily" # daily, weekly, every_30_minutes, every_2_hours
  retry_attempts: 3
  timeout: 30
  backup_old_secrets: true

logging:
  level: "INFO" #DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/rotation.log"
  console_enabled: false # Console output: Set to false in production

  # Use structured (JSON) logging for easier parsing
  # Recommended for production with log aggregation tools
  structured: false # Set to true if using ELK, Splunk, etc.

  max_file_size: "10MB" # Rotate when file reaches this size
  backup_count: 5 # Keep this many old log files
  separate_error_log: true # Separate error log file (ERROR and CRITICAL only)

  # Log format customization (when structured=false)
  format:
    file: "%(asctime)s - %(name)s - %(levelname)s - [%(module)s:%(funcName)s:%(lineno)d] - %(message)s"
    console: "%(asctime)s - %(levelname)s - %(message)s"

  lazy_evaluation: true # Use lazy string formatting
  mask_sensitive_data: true # Automatically mask passwords, keys, etc.

# Environment-specific overrides
environments:
  development:
    logging:
      level: "DEBUG"
      console_enabled: true
      structured: false

  production:
    logging:
      level: "INFO"
      console_enabled: false # DISABLE console in production
      structured: true
      separate_error_log: true

  testing:
    logging:
      level: "WARNING"
      console_enabled: false
      file: "logs/test.log"

web:
  enabled: true
  port: 8080
  host: "0.0.0.0"
  use_flask: true
  enable_flask_testing: false

  # Flask configuration
  # SECRET_KEY resolution (see src/secret_rotator/web/secret_key.py):
  #   1. This value, if set to a real secret (not the placeholder below)
  #   2. The FLASK_SECRET_KEY environment variable (recommended — avoids
  #      putting the key in a file at all)
  #   3. In dev/test: a random ephemeral key is generated automatically
  #   4. In production (SECRET_ROTATOR_ENV=production): startup fails if
  #      neither of the above is set, rather than falling back silently
  # NOTE: this config loader does NOT do "${VAR}" environment-variable
  # interpolation — leave this key unset and use FLASK_SECRET_KEY instead
  # unless you're intentionally hardcoding a value here.
  # secret_key: ""

  # (S11) Size of the Waitress WSGI server's request-handling thread
  # pool. Waitress runs in-process (not forked worker processes), so
  # this is the concurrency knob available under the current
  # single-instance architecture. Raise it if the dashboard feels slow
  # under concurrent use; there's no need to lower it for a small team.
  threads: 8

  # Dashboard login (S1). Required before the dashboard is reachable —
  # set with: secret-rotator --mode set-web-password
  # (or set SECRET_ROTATOR_ADMIN_USERNAME / SECRET_ROTATOR_ADMIN_PASSWORD_HASH
  # env vars instead, which take priority over these if both are present)
  auth:
    username: "admin"
    # password_hash is a werkzeug generate_password_hash() value, never
    # a plaintext password. Leave unset and the dashboard simply refuses
    # all logins until you run the CLI command above.
    # password_hash: ""

  # Security settings (for future use)
  # cors_enabled: false
  # allowed_origins: []
  # rate_limiting: true

providers:
  file_storage:
    type: "file"
    # IMPORTANT: Paths are relative to container root or absolute
    # In Docker, /app/data is a writable volume
    file_path: "data/secrets.json"
    backup_path: "data/backup/"

  aws_secrets:
    type: "aws"
    region: "<your-aws-region>"
    enabled: false

rotators:
  password_gen:
    type: "password"
    length: 16
    use_symbols: true
    use_numbers: true
    use_uppercase: true
    use_lowercase: true
    exclude_ambiguous: true

  api_key_gen:
    type: "api_key"
    length: 32
    format: "hex" # hex, base64, alphanumeric

jobs:
  - name: "database_password"
    provider: "file_storage"
    rotator: "password_gen"
    secret_id: "db_password"
    schedule: "weekly"
    notification: true

  - name: "api_key"
    provider: "file_storage"
    rotator: "api_key_gen"
    secret_id: "api_key"
    schedule: "monthly"
    notification: true

  - name: "service_token"
    provider: "file_storage"
    rotator: "password_gen"
    secret_id: "service_token"
    schedule: "daily"
    notification: false

notifications:
  enabled: true
  email:
    enabled: false
    smtp_server: "<your-smtp-server>"
    smtp_port: 587
    username: "<your-email>"
    password: "<your-app-password>"
    recipients: ["<your-recipient-email>"]

  slack:
    enabled: false
    webhook_url: "<your-slack-webhook-url>"
    channel: "<your-slack-channel>"

# Security settings
security:
  encryption:
    enabled: true
    # CRITICAL: Master key now stored in writable data volume
    # This allows the application to generate it on first run
    # Docker mount: /app/data (read-write)
    master_key_file: "data/.master.key"
    rotate_master_key_days: 90

# Backup configuration
backup:
  enabled: true
  # All backup paths in writable data volume
  storage_path: "data/backup/"
  encrypt_backups: true
  cleanup_time: "03:00"
  verification_time: "04:00"
  verify_integrity: true
  full_verification_enabled: true
  checksum_verification_enabled: true
  compression: true # gzip compression

  retention:
    days: 90
    max_backups_per_secret: 10

  # Master key backup configuration
  key_backup:
    # How to provide passphrase for encrypted backups
    # Options:
    #   "interactive"           - Prompt each time (most secure, requires TTY)
    #   "file:/path/to/file"    - Read from file (convenient for automation)
    #   "env:VARIABLE_NAME"     - Read from environment variable (good for CI/CD)
    #
    # If not set, will auto-detect from standard locations:
    #   - /run/secrets/backup_passphrase (Docker secret)
    #   - ~/.config/secret-rotator/.backup-passphrase (PyPI user config)
    #   - ~/.local/share/secret-rotator/.backup-passphrase (PyPI user data)
    #   - /app/data/.backup-passphrase (Docker data volume)
    passphrase_source: "interactive"

  # Master key backups stored in data volume (not read-only config)
  key_backups_path: "data/key_backups/"

  # Remote backup (optional). S3-compatible: works against AWS S3 and
  # any S3-compatible endpoint (MinIO, Cloudflare R2, etc.) — set
  # `endpoint_url` for non-AWS providers, leave it unset for AWS S3.
  remote_backup:
    enabled: false
    type: "s3" # currently only "s3" (S3-compatible) is implemented
    bucket: "my-secret-backups"
    region: "us-east-1"
    prefix: "rotator/backups/"
    # Leave unset for AWS S3. Set for S3-compatible providers, e.g.:
    #   MinIO:            "https://minio.example.com"
    #   Cloudflare R2:     "https://<account_id>.r2.cloudflarestorage.com"
    endpoint_url: ""
    # Credentials: leave unset to use the standard AWS credential chain
    # (env vars, ~/.aws/credentials, instance/task role, etc.) — this
    # is the recommended approach so keys never sit in this file.
    # Only set these directly for non-AWS providers without their own
    # credential-chain support, and prefer environment variables
    # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) over hardcoding here.
    # access_key_id: ""
    # secret_access_key: ""
    # Upload a copy of every local backup as soon as it's created, in
    # addition to periodic bulk sync. Off by default so enabling
    # remote_backup doesn't silently add network calls to the
    # rotation hot path until you're ready for it.
    upload_on_create: false

# Distributed coordination (Phase 3). Required once you run more than
# one instance of secret-rotator at a time — the in-process lock used
# automatically when this is disabled only protects against races
# *within* one process, not across instances.
distributed:
  enabled: false
  # Redis connection string. The REDIS_URL environment variable takes
  # priority over this if both are set (same precedence pattern as
  # web.secret_key / FLASK_SECRET_KEY elsewhere in this file) — prefer
  # the env var so connection strings with embedded credentials don't
  # sit in this file.
  redis_url: "redis://localhost:6379/0"
  # Seconds the master-key-rotation lock is held before Redis expires
  # it automatically — a safety net if the holder crashes mid-rotation.
  # Should comfortably exceed your slowest realistic rotation run.
  master_key_lock_timeout: 600
  # Same idea for a full rotate_all_secrets() sweep. Default assumes
  # up to ~3500 jobs at the current 1s-per-job pacing; lower it if you
  # have far fewer jobs and want a stuck sweep to free the lock sooner.
  rotation_lock_timeout: 3600
  # Redis list name RQ uses for queued rotation jobs. Only relevant
  # when enabled: true; every instance and every `secret-rotator
  # --mode worker` process must agree on this name (they all default
  # to the same value, so you only need to set this if you're running
  # more than one secret-rotator deployment against the same Redis).
  queue_name: "secret-rotator-rotations"
  # Max seconds an RQ worker lets a single rotation-sweep job run
  # before killing it. Same sizing logic as rotation_lock_timeout above.
  job_timeout: 3600
