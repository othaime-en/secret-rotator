{% extends "auth_base.html" %}

{% block title %}Sign in — Secret Rotator{% endblock %}

{% block content %}
<form class="auth-card" method="POST" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">

    <div class="brand"><span class="mk"></span>Secret Rotator</div>

    <div>
        <h1>Sign in</h1>
        <p class="muted">Access your rotation dashboard.</p>
    </div>

    {% if error %}
    <div class="badge err" role="alert">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <label class="field">Username
        <input class="input" type="text" id="username" name="username" autocomplete="username" required autofocus>
    </label>
    <label class="field">Password
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
    </label>

    <button type="submit" class="btn primary">Sign in</button>
</form>
{% endblock %}
