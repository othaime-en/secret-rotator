{% extends "base.html" %}

{% block title %}Sign in — Secret Rotation Dashboard{% endblock %}

{% block extra_css %}
<style>
    .login-card {
        max-width: 360px;
        width: 100%;
        margin: 60px auto;
    }
    .login-card h1 {
        font-size: 20px;
        border-bottom: none;
        padding-bottom: 0;
        margin-bottom: 6px;
    }
    .login-subtitle {
        color: #777;
        font-size: 13px;
        margin-bottom: 22px;
    }
    .login-field {
        margin-bottom: 14px;
    }
    .login-field label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: #555;
        margin-bottom: 5px;
    }
    .login-field input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        box-sizing: border-box;
    }
    .login-error {
        background: #fdecea;
        color: #9a3e20;
        border: 1px solid #f3c6bb;
        padding: 8px 10px;
        border-radius: 5px;
        font-size: 13px;
        margin-bottom: 14px;
    }
    .login-submit {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .login-submit:hover {
        background: #0062cc;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-card">
    <h1>Secret Rotator</h1>
    <div class="login-subtitle">Sign in to access the dashboard</div>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="login-field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="login-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-submit">Sign in</button>
    </form>
</div>
{% endblock %}
