<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secret Rotation Dashboard{% endblock %}</title>
    <!-- Rendered manually rather than via Flask-WTF's csrf_meta_tag()
         helper: that helper only exists in Flask-WTF >=1.3.0, which
         requires Python >=3.10. This project still supports Python 3.9
         (see .github/workflows/test.yml), so we're pinned to
         Flask-WTF==1.2.2, which only provides the older csrf_token()
         global — available in both versions. Functionally identical. -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Core JavaScript -->
    <script src="{{ url_for('static', filename='js/api-client.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tabs.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

    {% block extra_js %}{% endblock %}
</body>

</html>
